{% extends "base.html" %}

{% block content %}

<h2>Add Website</h2>

<form method="post" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" required>
    </div>
    <div class="mb-3">
        <label class="form-label">URL</label>
        <input class="form-control" name="url" placeholder="https://example.com" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Expected Status</label>
        <input class="form-control" name="expected_status" value="200">
    </div>
    <div class="mb-3">
        <label class="form-label">Check Interval (minutes)</label>
        <input class="form-control" name="check_interval" value="5">
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" placeholder="alerts@example.com">
        <div class="form-text">Optional: receive email alerts when availability changes.</div>
    </div>
    <button class="btn btn-success">Save Website</button>
    <a href="/" class="btn btn-secondary ms-2">Cancel</a>
</form>

{% endblock %}
